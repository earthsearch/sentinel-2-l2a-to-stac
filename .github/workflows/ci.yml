name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # approximates the release regex `^v\d{4}\.\d{2}\.\d{2}(\.\d+)?(-[.\d\w]+)?$`
      # as a glob, since GitHub ref filters don't support full regex.
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Push image to ECR for this manual run?"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::608149789419:role/es-v2-ecr-ci
  ECR_REPO_NAME: es-v2/cirrus-task-sentinel-2-l2a-to-stac

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest

  image:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Never push from PRs; on manual runs, only push if the checkbox was ticked.
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.force_push == true) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # The push trigger's tag glob is looser than the release regex (it
      # allows trailing junk after the day, e.g. v2026.09.29abcs), so
      # re-validate the full pattern before authenticating/publishing.
      - if: env.SHOULD_PUSH == 'true' && startsWith(github.ref, 'refs/tags/')
        name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?(-[.0-9A-Za-z]+)?$ ]]; then
            echo "::error::Tag '$REF_NAME' does not match release pattern ^v\d{4}\.\d{2}\.\d{2}(\.\d+)?(-[.\d\w]+)?\$"
            exit 1
          fi

      - if: env.SHOULD_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: env.SHOULD_PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          # PRs skip ECR login, so fall back to a dummy registry to keep the
          # generated refs parseable for the build-only path.
          images: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPO_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
