# Configuration file for pre-commit (https://pre-commit.com/).
# Please run `pre-commit run --all-files` when adding or changing entries.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: trailing-whitespace
      - id: check-json
      - id: check-merge-conflict
      - id: detect-aws-credentials
      - id: end-of-file-fixer
  # Local hook (not mirrors-mypy): third-party deps here include a git-pinned
  # pystac fork and packages without PyPI stubs, which additional_dependencies
  # can't replicate. Running mypy inside the project's own uv-managed venv
  # keeps it in sync with `uv run mypy` and avoids spurious Any-typed imports.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args: [src, tests, scripts]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
