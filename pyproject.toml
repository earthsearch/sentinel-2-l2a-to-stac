[project]
name = "sentinel-2-l2a-to-stac"
version = "0.1.0"
authors = [{ name = "Matthew Hanson", email = "matt.a.hanson@gmail.com" }]
description = "Sentinel-2 L2A to STAC Cirrus task"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["stac", "workflow", "cirrus"]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "boto3-utils>=0.4.2",
    "multiformats~=0.3.1",
    "numpy>=2.4.6",
    "pillow~=12.0",
    "rasterio~=1.4",
    "requests>=2.34.2",
    "returns~=0.29",
    "stactask>=0.7.0",
    "stactools~=0.5.3",
    "stactools-sentinel2==0.8.0",
]

[project.scripts]
sentinel-2-l2a-to-stac = "sentinel_2_l2a_to_stac.task:Sentinel2ToStac.cli"


[tool.mypy]
show_error_codes = true
strict = true
warn_unused_ignores = true

# Third-party libraries without type stubs or a py.typed marker. Ships no
# typing info, so under --strict mypy would emit import-untyped; scope the
# suppression to just these modules rather than weakening strictness globally.
[[tool.mypy.overrides]]
module = ["boto3utils.*", "botocore.*", "deepdiff.*", "multiformats.*", "numpy.*", "rasterio.*", "stactools.*", "shapely.geometry"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The `system` marker flags the network-hitting parity tests in
# tests/test_task.py (they download real Sentinel-2 imagery from the public
# RODA/AWS bucket and run the full COG/thumbnail pipeline). They are OPT-IN:
# `addopts` deselects them by default so `uv run pytest` stays fast and
# offline. To run them, override the marker expression on the CLI:
#     uv run pytest -m system
# The trailing CLI `-m` wins over the `-m "not system"` in addopts.
addopts = ["-m", "not system"]
markers = [
    "system: network-hitting parity tests against real imagery (opt in with -m system)",
]
filterwarnings = [
    # Silence DeprecationWarnings from third-party libraries (already present).
    "ignore::DeprecationWarning",
    # Rasterio internally uses the `*` operator for Affine matrix multiplication;
    # suppress the PendingDeprecationWarning it emits until rasterio fixes this.
    "ignore::PendingDeprecationWarning:rasterio.*",
    # antimeridian.FixWindingWarning fires when stactools-sentinel2 passes a
    # clockwise exterior ring; it auto-fixes the winding, but the warning is
    # noise from a third-party call we don't control.  Matched by message text
    # + module so our own code can still raise warnings freely.
    "ignore:The exterior ring::antimeridian.*",
]

[tool.ruff]
lint.select = ["F", "E", "W", "I", "ERA", "RUF"]

[dependency-groups]
dev = [
    "deepdiff>=8.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
    "ruff>=0.16.5",
    "shapely>=2.0",
    "types-requests>=2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
