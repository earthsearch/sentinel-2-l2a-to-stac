[project]
name = "sentinel-2-l2a-to-stac"
version = "0.1.0"
authors = [{ name = "Matthew Hanson", email = "matt.a.hanson@gmail.com" }]
description = "Sentinel-2 L2A to STAC Cirrus task"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["stac", "workflow", "cirrus"]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "boto3-utils>=0.4.2",
    "stactask>=0.7.0",
]

[project.scripts]
sentinel-2-l2a-to-stac = "sentinel_2_l2a_to_stac.task:Sentinel2ToStac.cli"


[tool.mypy]
show_error_codes = true
strict = true
warn_unused_ignores = true

# Third-party libraries without type stubs or a py.typed marker. Ships no
# typing info, so under --strict mypy would emit import-untyped; scope the
# suppression to just these modules rather than weakening strictness globally.
[[tool.mypy.overrides]]
module = ["boto3utils.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
lint.select = ["F", "E", "W", "I", "ERA", "RUF"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
