[project]
name = "sentinel-2-l2a-to-stac"
version = "v2026.09.30"
authors = [
    { name = "Element 84", email = "opendata@element84.com" },
    { name = "Tyler Anderson", email= "tanderson@element84.com"},
    { name = "Vinny Pilone", email = "vpilone@element84.com"}
]
description = "Sentinel-2 L2A to STAC Cirrus task"
readme = "README.md"
# pystac 2.0-dev requires Python >= 3.12.
requires-python = ">=3.12"
keywords = ["stac", "workflow", "cirrus"]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "antimeridian>=0.4.8",
    "boto3>=1.43.56",
    "boto3-utils>=0.4.2",
    "lxml>=6.0",
    "multiformats~=0.3.1",
    "numpy>=2.4.6",
    "pillow~=12.0",
    "pyproj>=3.7",
    "pystac",
    "raster-footprint>=0.3.0",
    "rasterio~=1.5",
    "requests>=2.34.2",
    "returns~=0.29",
    "shapely>=2.0",
    "stactask>=0.7.0",
]

[tool.uv.sources]
# pystac 2.0 (unreleased) pinned to a specific commit SHA for reproducibility
# — never a floating @main. This is the dev build that carries
# the native core `bands` API (Asset.bands / Band). Bump the SHA deliberately
# and re-verify.
pystac = { git = "https://github.com/stac-utils/pystac.git", rev = "4f346f2e1a1db00d526ef052800f24e19c72476c" }

[project.scripts]
sentinel-2-l2a-to-stac = "sentinel_2_l2a_to_stac.task:Sentinel2ToStac.cli"


[tool.mypy]
show_error_codes = true
strict = true
warn_unused_ignores = true

# Third-party libraries without type stubs or a py.typed marker. Ships no
# typing info, so under --strict mypy would emit import-untyped; scope the
# suppression to just these modules rather than weakening strictness globally.
[[tool.mypy.overrides]]
module = ["botocore.*", "deepdiff.*", "lxml.*", "multiformats.*", "numpy.*", "raster_footprint.*", "rasterio.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The `system`, `upgrade` and `downgrade` markers flag the network-hitting tests
# in tests/test_task.py. They are OPT-IN: `addopts` deselects them so
# `uv run pytest` stays fast and offline. Run one by overriding the marker
# expression on the CLI (the trailing `-m` wins over addopts):
#     uv run pytest -m system
addopts = ["-m", "not system and not upgrade and not downgrade"]
markers = [
    "system: network-hitting parity tests against real imagery (opt in with -m system)",
    "upgrade: network-hitting parity tests against earthsearch-hosted products for the update-first path (opt in with -m upgrade)",
    "downgrade: network-hitting parity tests for the v1_output downgrade path (opt in with -m downgrade)",
]
filterwarnings = [
    # pystac 2.0-dev deprecates some of its own internal modules on import.
    "ignore::DeprecationWarning:pystac.*",
    # Payloads still use the legacy `upload_options.collections` mapping rather
    # than stactask's `collection_matchers`.
    "ignore:'upload_options.collections' is deprecated:DeprecationWarning",
    # Rasterio internally uses the `*` operator for Affine matrix multiplication;
    # suppress the PendingDeprecationWarning it emits until rasterio fixes this.
    "ignore::PendingDeprecationWarning:rasterio.*",
    # antimeridian.FixWindingWarning fires when metadata.py passes a clockwise
    # exterior ring; it auto-fixes the winding, but the warning is noise from a
    # third-party call we don't control. Matched by message text + module so
    # our own code can still raise warnings freely.
    "ignore:The exterior ring::antimeridian.*",
    # pystac raises this when any caller sets link.target = <str>; the warning
    # is issued from pystac.link itself, so the module filter must match there.
    "ignore:Setting Link.target to href:UserWarning:pystac.*",
]

[tool.ruff]
lint.select = ["F", "E", "W", "I", "ERA", "RUF"]

[dependency-groups]
dev = [
    "awscrt>=0.37.0",
    "cirrus-geo[cli]>=2.0.0",
    "deepdiff>=8.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
    "ruff>=0.16.5",
    "types-requests>=2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
